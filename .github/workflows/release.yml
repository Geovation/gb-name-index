name: Release client

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Test JavaScript client and docs
        run: npm test
      - name: Test Python builders
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build client, docs, and harness
        run: npm run build
      - name: Open or update release PR
        id: release
        if: github.ref_type == 'branch'
        uses: googleapis/release-please-action@v4
        with:
          release-type: node
          package-name: '@geovation/gb-name-index'
      - name: Verify release tag matches project version
        if: github.ref_type == 'tag' || steps.release.outputs.release_created == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name || github.ref_name }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "$version"
      - name: Package versioned client archive
        if: github.ref_type == 'tag' || steps.release.outputs.release_created == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name || github.ref_name }}
        run: |
          mkdir release-client
          cp dist/index.js dist/index.cjs dist/index.global.js ATTRIBUTION.md LICENSE release-client/
          archive="gb-name-index-client-${RELEASE_TAG}.zip"
          (cd release-client && zip -q -r "../$archive" .)
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Attach client archive to GitHub Release
        if: github.ref_type == 'tag' || steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARCHIVE" --clobber
          else
            gh release create "$RELEASE_TAG" "$ARCHIVE" --title "$RELEASE_TAG" --generate-notes
          fi