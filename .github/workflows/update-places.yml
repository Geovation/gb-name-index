name: Update GB Name Index

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-places.yml'
      - 'ATTRIBUTION.md'
      - '_config.yml'
      - '_includes/**'
      - 'LICENSE'
      - 'README.md'
      - 'assets/**'
      - 'builders/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - 'scripts/**'
      - 'src/**'
      - 'web/**'
      - 'tests/**'
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      force_index_refresh:
        description: Rebuild the index even if a recent copy is available
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-places-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Test JavaScript client
        run: npm test
      - name: Test Python builders
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build JavaScript client
        run: npm run build
      - name: Restore the latest built index
        uses: actions/cache/restore@v4
        with:
          path: |
            build/data
            build/index-cache/refreshed-at
          key: gb-name-index-${{ hashFiles('builders/**/*.py', 'requirements.txt') }}-${{ github.run_id }}
          restore-keys: |
            gb-name-index-${{ hashFiles('builders/**/*.py', 'requirements.txt') }}-
      - name: Decide whether to rebuild the index
        id: index-refresh
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_INDEX_REFRESH: ${{ github.event.inputs.force_index_refresh || 'false' }}
        run: |
          refresh=false
          reason="A recent built index is available"
          refreshed_at_file=build/index-cache/refreshed-at

          if [[ "$EVENT_NAME" == "schedule" || "$FORCE_INDEX_REFRESH" == "true" ]]; then
            refresh=true
            reason="The schedule or manual force option requires a fresh index"
          elif [[ ! -s build/data/index.json || ! -s "$refreshed_at_file" ]]; then
            refresh=true
            reason="No cached index is available"
          else
            refreshed_at=$(cat "$refreshed_at_file")
            if ! [[ "$refreshed_at" =~ ^[0-9]+$ ]]; then
              refresh=true
              reason="The cached index timestamp is invalid"
            elif (( $(date -u +%s) - refreshed_at >= 2592000 )); then
              refresh=true
              reason="The cached index is at least 30 days old"
            fi
          fi

          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"
          echo "$reason"
      - name: Build unified name index
        if: steps.index-refresh.outputs.refresh == 'true'
        run: python -m builders.build_places_index
      - name: Record index refresh time
        if: steps.index-refresh.outputs.refresh == 'true'
        run: |
          mkdir -p build/index-cache
          date -u +%s > build/index-cache/refreshed-at
      - name: Cache the refreshed index
        if: steps.index-refresh.outputs.refresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/data
            build/index-cache/refreshed-at
          key: gb-name-index-${{ hashFiles('builders/**/*.py', 'requirements.txt') }}-${{ github.run_id }}
      - name: Check GitHub Pages size limits
        run: npm run check-pages-size
      - name: Clear previous Pages output
        run: rm -rf build/pages-source build/pages-site
      - name: Prepare Jekyll source
        run: |
          mkdir -p build/pages-source
          cp README.md ATTRIBUTION.md LICENSE _config.yml build/pages-source/
          cp -R _includes assets docs build/pages-source/
          cp ATTRIBUTION.md build/pages-source/_includes/attribution.md
          cp LICENSE build/pages-source/_includes/license.md
          cp web/docs.css web/jekyll-mermaid.js build/pages-source/
          mkdir -p build/pages-source/assets/fonts
          cp node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2 build/pages-source/assets/fonts/
          cp node_modules/@fontsource-variable/manrope/LICENSE build/pages-source/assets/fonts/LICENSE
      - uses: actions/configure-pages@v5
      - name: Build Markdown site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: build/pages-source
          destination: build/pages-site
      - name: Return Jekyll output to the runner
        run: sudo chown -R "$(id -u):$(id -g)" build/pages-site
      - name: Add generated index, harness, and client
        run: |
          mkdir -p build/pages-site/data build/pages-site/client build/pages-site/harness build/pages-site/assets
          cp -R build/data/. build/pages-site/data/
          cp -R dist/. build/pages-site/client/
          cp ATTRIBUTION.md build/pages-site/client/
          cp -R build/harness-preview/harness/. build/pages-site/harness/
          cp -R build/harness-preview/assets/. build/pages-site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages-site
          retention-days: 1
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4