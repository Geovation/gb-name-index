name: Update GB Name Index

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-places.yml'
      - 'ATTRIBUTION.md'
      - '_config.yml'
      - '_includes/**'
      - 'LICENSE'
      - 'README.md'
      - 'assets/**'
      - 'builders/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - 'scripts/**'
      - 'src/**'
      - 'web/**'
      - 'tests/**'
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-places-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Test JavaScript client
        run: npm test
      - name: Test Python builders
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build JavaScript client
        run: npm run build
      - name: Build unified name index
        run: python -m builders.build_places_index
      - name: Check GitHub Pages size limits
        run: npm run check-pages-size
      - name: Prepare Jekyll source
        run: |
          mkdir -p build/pages-source
          cp README.md ATTRIBUTION.md LICENSE _config.yml build/pages-source/
          cp -R _includes assets docs build/pages-source/
          cp web/docs.css web/jekyll-mermaid.js build/pages-source/
          mkdir -p build/pages-source/fonts
          cp node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2 build/pages-source/fonts/
          cp node_modules/@fontsource-variable/manrope/LICENSE build/pages-source/fonts/LICENSE
      - uses: actions/configure-pages@v5
      - name: Build Markdown site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: build/pages-source
          destination: build/pages-site
      - name: Add generated index, harness, and client
        run: |
          mkdir -p build/pages-site/data build/pages-site/client build/pages-site/harness build/pages-site/assets
          cp -R build/data/. build/pages-site/data/
          cp -R dist/. build/pages-site/client/
          cp ATTRIBUTION.md build/pages-site/client/
          cp -R build/harness-preview/harness/. build/pages-site/harness/
          cp -R build/harness-preview/assets/. build/pages-site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages-site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4