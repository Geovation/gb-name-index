name: Update GB Name Index

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-places-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build JavaScript client
        run: npm run build
      - name: Build unified name index
        run: python build_places_index.py
      - name: Check GitHub Pages size limits
        run: npm run check-pages-size
      - name: Publish name index
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_NAME: ${{ github.actor }}
          COMMIT_ID: ${{ github.actor_id }}
        run: |
          mkdir published
          cd published
          git init
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch origin gh-pages:gh-pages || true
          if git show-ref --verify --quiet refs/heads/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi
          git rm -rf data client index.html assets app.js site.css || true
          mkdir -p data
          cp -R ../build/data/. data/
          cp -R ../build/harness-preview/. .
          git config user.name "${COMMIT_NAME}"
          git config user.email "${COMMIT_ID}+${COMMIT_NAME}@users.noreply.github.com"
          git add data client index.html assets
          git diff --cached --quiet && exit 0
          git checkout --orphan refreshed-gh-pages
          git add -A
          git commit -m "Update GB name index"
          git branch -D gh-pages || true
          git branch -m gh-pages
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" push --force origin gh-pages